worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Dynamic Docker DNS resolution
    resolver 127.0.0.11 valid=10s;

    map $http_origin $cors_origin {
        default "*";
    }

    client_max_body_size 20M;

    server {
        listen 80 default_server;
        server_name localhost 127.0.0.1 _;

        # === Health Check (root) ===
        location = / {
            default_type application/json;
            return 200 '{"status":"ok","services":["osrm","vroom-raw","vroom-service","ortools"]}';
        }

        # === OSRM ROUTING & TABLE API ===
        location /route/osrm/ {
            if ($request_method = OPTIONS) { return 204; }
            set $osrm_target http://osrm:5000;
            rewrite ^/route/osrm/(.*) /$1 break;
            proxy_pass $osrm_target;
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-API-Key" always;
        }

        # === VROOM 2-PHASE SOLVER API (Unified Service) ===
        location /route/vroom/ {
            if ($request_method = OPTIONS) { return 204; }
            set $vroom_service_target http://vroom-service:8006;
            rewrite ^/route/vroom/(.*) /$1 break;
            proxy_pass $vroom_service_target;
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-API-Key" always;
            proxy_read_timeout 120s;
        }

        # === VROOM RAW ENGINE (Direct C++ Engine) ===
        location /route/vroom-raw/ {
            if ($request_method = OPTIONS) { return 204; }
            set $vroom_raw_target http://vroom:3000;
            rewrite ^/route/vroom-raw/(.*) /$1 break;
            proxy_pass $vroom_raw_target;
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-API-Key" always;
            proxy_read_timeout 120s;
        }

        # === GOOGLE OR-TOOLS SOLVER API ===
        location /route/ortools/ {
            if ($request_method = OPTIONS) { return 204; }
            set $ortools_target http://ortools:8008;
            rewrite ^/route/ortools/(.*) /$1 break;
            proxy_pass $ortools_target;
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-API-Key" always;
            proxy_read_timeout 120s;
        }
    }
}
